<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code — Suivi TSP</title>
<link rel="stylesheet" href="style.css">
<style>
  .qr-wrap{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--concrete); padding:24px;
  }
  .qr-card{
    background:var(--panel); border-radius:16px; padding:40px 50px;
    box-shadow:0 8px 30px rgba(20,40,30,.12); text-align:center; max-width:360px;
  }
  #qrcode{ margin:20px 0; }
  #qrcode img{ width:220px; height:220px; border:1px solid var(--line); border-radius:8px; }
  .qr-url{
    font-family:var(--font-mono); font-size:13px; color:var(--text);
    background:var(--panel-2); padding:8px 14px; border-radius:8px; display:inline-block;
    word-break:break-all;
  }
  .qr-print-btn{ margin-top:20px; }
  .qr-back{ display:block; margin-top:16px; font-size:12.5px; color:var(--muted); text-decoration:none; }
  .qr-back:hover{ color:var(--ocp-forest); }
  @media print{
    .qr-print-btn, .qr-back{ display:none; }
    .qr-wrap{ background:white; }
    .qr-card{ box-shadow:none; }
  }
</style>
</head>
<body>
  <div class="qr-wrap">
    <div class="qr-card">
      <img src="logo-atelier-tsp.png" alt="Atelier TSP" style="height:70px;width:auto;margin-bottom:8px;">
      <h1 style="font-size:20px;margin:0 0 2px;">Suivi Journalier des Équipements</h1>
      <div class="sub" style="margin-bottom:8px;">Atelier TSP — Groupe OCP</div>
      <div id="qrcode"></div>
      <div class="qr-url" id="qrUrl"></div>
      <button class="auth-submit qr-print-btn" onclick="window.print()">🖨 Imprimer</button>
      <a href="index.html" class="qr-back">← Retour au tableau de bord</a>
    </div>
  </div>
  <script>
    const appUrl = window.location.origin + window.location.pathname.replace(/qrcode\.html(\?.*)?$/, 'index.html');
    document.getElementById('qrUrl').textContent = appUrl.replace(/^https?:\/\//, '');
    const qrImgUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&color=145C38&data=' + encodeURIComponent(appUrl);
    document.getElementById('qrcode').innerHTML = '<img src="' + qrImgUrl + '" alt="QR Code">';
  </script>
</body>
</html>
